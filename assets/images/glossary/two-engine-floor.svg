  <g font-family="Space Mono,monospace"><text x="72" y="73" fill="#e8a24a" font-size="18" letter-spacing="4">TWO-ENGINE FLOOR</text><text x="182" y="151" text-anchor="middle" fill="#ddeeff" font-size="25">ENGINE A</text><text x="182" y="181" text-anchor="middle" fill="#6b8aad" font-size="15">1D-NLTE + DELTAS</text><text x="538" y="151" text-anchor="middle" fill="#ddeeff" font-size="25">ENGINE B</text><text x="538" y="181" text-anchor="middle" fill="#6b8aad" font-size="15">TS-NATIVE NLTE</text><text x="360" y="313" text-anchor="middle" fill="#4fc3f7" font-size="22">SELECT + COMPARE</text><text x="360" y="341" text-anchor="middle" fill="#a8c0d8" font-size="14">SPREAD STAYS VISIBLE</text></g>
  <g fill="none" stroke="#4fc3f7" stroke-width="4"><path d="M182 208v34h178v32"/><path d="M538 208v34H360v32"/></g><g fill="#4fc3f7"><path d="M352 264l8 14 8-14z"/></g>
