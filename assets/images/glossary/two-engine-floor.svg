<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Two-engine floor</title><desc id="desc">Engine A and Engine B run in parallel, feed a selector, and pass through a disagreement gate.</desc>
