<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Ratified freeze tiers</title><desc id="desc">A measurement and ratification decision separates gold, owed-held, owed-blank, and data-gap states.</desc>
  <rect width="720" height="440" fill="#080e1a"/><rect x="32" y="30" width="656" height="380" fill="none" stroke="#1a2640" stroke-width="2"/>
  <g font-family="Space Mono,monospace"><text x="72" y="73" fill="#e8a24a" font-size="18" letter-spacing="4">RATIFIED FREEZE TIERS</text><text x="360" y="128" fill="#ddeeff" font-size="20" text-anchor="middle">MEASURED VALUE?</text>
  <g fill="none" stroke="#1a2640" stroke-width="2"><rect x="70" y="276" width="165" height="78"/><rect x="278" y="276" width="165" height="78"/><rect x="486" y="276" width="165" height="78"/></g>
  <text x="152" y="310" fill="#52c78a" font-size="20" text-anchor="middle">GOLD</text><text x="152" y="334" fill="#a8c0d8" font-size="13" text-anchor="middle">RATIFIED</text><text x="360" y="310" fill="#e8a24a" font-size="20" text-anchor="middle">OWED</text><text x="360" y="334" fill="#a8c0d8" font-size="13" text-anchor="middle">HELD OR BLANK</text><text x="568" y="310" fill="#6b8aad" font-size="20" text-anchor="middle">DATA-GAP</text><text x="568" y="334" fill="#a8c0d8" font-size="13" text-anchor="middle">NOT MEASURED</text><text x="218" y="206" fill="#4fc3f7" font-size="14">YES</text><text x="520" y="206" fill="#4fc3f7" font-size="14">NO</text></g>
  <g fill="none" stroke="#4fc3f7" stroke-width="3"><path d="M360 142v48H152v86"/><path d="M360 190h208v86"/><path d="M360 190v86"/></g>
</svg>
