<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release Roadmap · The Exoplanet Codex</title>
  <meta name="description" content="Product-based release roadmap for The Exoplanet Codex.">
  <link rel="canonical" href="https://exoplanetcodex.org/roadmap.html">
  <style>
    :root{--void:#04060d;--deep:#080d18;--rim:#1a2640;--text:#c8d8e8;--bright:#edf6ff;--dim:#8299af;--muted:#50677f;--cyan:#4fc3f7;--warm:#e8a24a;--green:#61d095;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--serif:Georgia,"Times New Roman",serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--void);color:var(--text);font-family:var(--mono);padding:clamp(1rem,3vw,2rem)}
    main{max-width:1120px;margin:0 auto}
    .eyebrow{color:var(--cyan);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:.5rem}
    h1{font:300 clamp(1.7rem,4vw,2.7rem) var(--serif);color:var(--bright);margin-bottom:.55rem}
    .intro{color:var(--dim);font-size:.78rem;line-height:1.65;max-width:760px;margin-bottom:1.5rem}
    .release-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rim);border:1px solid var(--rim)}
    .release{background:var(--deep);padding:clamp(1rem,2.5vw,1.6rem);min-width:0}
    .release-status{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:.8rem}
    .release[data-status="in_progress"] .release-status{color:var(--cyan)}
    .release[data-status="planned"] .release-status{color:var(--warm)}
    .release h2{font:300 1.35rem/1.2 var(--serif);color:var(--bright);margin-bottom:.75rem}
    .release-summary{font-size:.72rem;line-height:1.6;color:var(--dim);min-height:6.8em}
    .target{border-top:1px solid var(--rim);padding-top:.9rem;margin-top:.9rem}
    .target-head{display:flex;justify-content:space-between;gap:.7rem;font-size:.65rem;color:var(--bright);margin-bottom:.55rem}
    .target-count{color:var(--cyan);white-space:nowrap}
    .track{height:3px;background:var(--rim);overflow:hidden}
    .fill{height:100%;background:var(--cyan);width:0;transition:width .7s ease}
    .release[data-status="complete"] .fill{background:var(--green)}
    .notes{list-style:none;margin-top:.85rem;color:var(--muted);font-size:.62rem;line-height:1.55}
    .notes li+li{margin-top:.35rem}.notes li::before{content:"— ";color:var(--cyan)}
    .source{margin-top:1rem;color:var(--muted);font-size:.56rem;line-height:1.5}
    .error{border:1px solid var(--rim);padding:1.2rem;color:var(--dim);font-size:.72rem}
    @media(max-width:760px){.release-grid{grid-template-columns:1fr}.release-summary{min-height:0}.release{padding:1.25rem}}
    @media(prefers-reduced-motion:reduce){.fill{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Scientific release roadmap</div>
    <h1>Progress measured in products</h1>
    <p class="intro">Release progress counts reviewed, current elemental abundance products—not project-management activity. Missing, provisional, superseded, and quarantined results never advance a release.</p>
    <div id="release-roadmap" aria-live="polite"><p class="error">Loading release product…</p></div>
  </main>
  <script src="/assets/js/release-roadmap.js"></script>
</body>
</html>
