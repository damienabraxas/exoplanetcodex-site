name: Education integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  education:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright
      - run: node --test tests/test_education_core.mjs
      - run: python -m unittest discover -s tests -p test_education.py
      - run: python scripts/generate_education.py --check
      - run: python scripts/sync_education_navigation.py --check
      - run: playwright install --with-deps chromium
      - name: Browser, keyboard, mobile, fallbacks and WCAG A/AA checks
        run: |
          python -m http.server 8523 --bind 127.0.0.1 &
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.js
          python tests/browser_education.py http://127.0.0.1:8523 /tmp/axe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-browser-evidence
          path: docs/qa/rya1379/
