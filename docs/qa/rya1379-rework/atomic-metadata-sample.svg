<svg viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="atomic-metadata"><title>atomic-metadata</title><desc>NIST level and line tables provide identities. The pinned Codex canonical_gf rows provide adopted log(gf), NIST accuracy grade and retained GES/VALD candidate columns. These historical candidates are not independent new external queries. An accuracy grade describes atomic-data uncertainty, not approval for a stellar analysis. NIST is an evaluated compilation; experimental/theoretical origins are not classified where the snapshot does not establish them. Missing H log(gf) and missing grades stay unknown, not zero. This explorer does not promote Theoretical Atomic Lab candidates. Sources: https://physics.nist.gov/Pubs/AtSpec/node17.html</desc><rect width="720" height="350" fill="#050c17"/><svg viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Source log(gf) comparison" y="0" width="720" height="350"><title>Source log(gf) comparison</title><desc>Source log(gf) comparison</desc><rect width="720" height="350" fill="#050c17"/><path d="M62 94 V280 H696" stroke="#627e9c" fill="none" stroke-width="2"/><text x="62" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">-0.25</text><text x="5" y="284" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.03</text><text x="220.5" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">0.63</text><text x="5" y="239" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.07</text><text x="379" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">1.50</text><text x="5" y="194" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.11</text><text x="537.5" y="305" text-anchor="middle" style="fill: