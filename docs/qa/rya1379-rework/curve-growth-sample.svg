<svg viewBox="0 0 720 700" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="curve-growth"><title>curve-growth</title><desc>F(v)=exp[−A φ(v)] with unit-area Gaussian φ, A=5×10^ΔA km/s and sigma=b/√2. W is integrated and converted at a hypothetical 500 nm line. Inversion uses the same fixed transition strength and atmosphere proxy; it returns only a synthetic differential abundance, not a calibrated A(X) or Codex result. This Gaussian-opacity model shows linear and saturation regimes, not the damping-wing branch. Increasing b can increase saturated EW at unchanged abundance. Instrument convolution conserves full EW and is distinct from opacity broadening. Sources: https://www.astro.uvic.ca/~tatum/stellatm/atm11.pdf</desc><rect width="720" height="700" fill="#050c17"/><svg viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Synthetic curve of growth" y="0" width="720" height="350"><title>Synthetic curve of growth</title><desc>Synthetic curve of growth</desc><rect width="720" height="350" fill="#050c17"/><path d="M62 94 V280 H696" stroke="#627e9c" fill="none" stroke-width="2"/><text x="62" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">-2.00</text><text x="5" y="284" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.00</text><text x="220.5" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">-1.00</text><text x="5" y="239" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">42.08</text><text x="379" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">0.00</text><text x="5" y="194" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">84.16</text><text x="537.5" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-fam