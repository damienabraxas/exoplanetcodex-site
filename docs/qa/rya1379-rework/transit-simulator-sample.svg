<svg viewBox="0 0 720 620" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="transit-simulator"><title>transit-simulator</title><desc>Opaque spherical planet and spherical star, circular orbit, a/R★=10 and P=3 days fixed. Impact parameter b=(a/R★) cos i determines geometry. Linear intensity I(μ)=1−u(1−μ), with disk normalization π(1−u/3). Uniform disks use exact circle overlap; limb darkening uses 900 radial annuli. No spots, dilution, exposure averaging or transit timing variations. a/R★ and P imply a fixed stellar-density scale; no stellar mass/radius is inferred here. This is a teaching implementation, not batman or a fitted planet. Sources: https://arxiv.org/abs/1507.08285</desc><rect width="720" height="620" fill="#050c17"/><svg viewBox="0 0 720 270" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Planet crossing the stellar disk" y="0" width="720" height="270"><title>Planet crossing the stellar disk</title><desc>Projected geometry; planet radius and impact parameter share the stellar-radius scale.</desc><rect width="720" height="270" fill="#050c17"/><defs><radialGradient id="transit-star-gradient"><stop offset="0" stop-color="#ffe1a1"/><stop offset="1" stop-color="rgb(163,128,100)"/></radialGradient></defs><circle cx="360" cy="135" r="105" fill="url(#transit-star-gradient)"/><path d="M70 114 H650" stroke="#6b8aad" fill="none" stroke-width="2" stroke-dasharray="4 5"/><circle cx="360" cy="114" r="10.5" fill="#080e1a" stroke="#4fc3f7"/><text x="30" y="28" text-anchor="start" style="fill: rgb(221, 238, 255); font-size: 13px; font-family: monospace;">Projected orbit near transit · R★ = disk radius</text><text x="30" y="256" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">Disk intensity illustration; light curve uses the stated limb law.</text></svg><svg viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Transit light curve" y="270" width="720" height="350"><title>Transit light curve</title><desc>Transit light curve</desc><rect width="720" height="350" fill="#050c17"/><path d="M62 94 V280 H696" stroke="#627e9c" fill="none" stroke-width="2"/><text x="62" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">-4.00</text><text x="5" y="284" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.98</text><text x="220.5" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">-2.00</text><text x="5" y="239" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.99</text><text x="379" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">0.00</text><text x="5" y="194" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">0.99</text><text x="537.5" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">2.00</text><text x="5" y="149" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">1.00</text><text x="696" y="305" text-anchor="middle" style="fill: rgb(154, 178, 204); font-size: 12px; font-family: monospace;">4.00</text><text x="5" y="104" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">1.00</text><text x="62" y="24" text-anchor="start" style="fill: rgb(221, 238, 255); font-size: 15px; font-family: monospace;">Transit light curve</text><text x="62" y="335" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">Time from mid-transit (hours)</text><text x="62" y="49" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">Relative stellar flux</text><path d="M62.00 125.71 L65.52 125.71 L69.04 125.71 L72.57 125.71 L76.09 125.71 L79.61 125.71 L83.13 125.71 L86.66