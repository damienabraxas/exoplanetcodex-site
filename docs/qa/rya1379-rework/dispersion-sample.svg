<svg viewBox="0 0 720 280" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="dispersion"><title>dispersion</title><desc>Prism: SCHOTT N-BK7 Sellmeier n(λ), minimum deviation δ = 2 asin(n sin(A/2)) − A. Each wavelength is evaluated at its own minimum-deviation incidence; the illustration is not a common-incidence ray trace. Grating: normal incidence in vacuum, d sin θ = mλ. An order with |mλ/d| &gt; 1 does not propagate. Prism refraction is not diffraction. Angles and angular dispersion are numeric; ray positions are schematic. Sources: https://media.schott.com/api/public/content/41e799d0bf874807a0bb8e702fbb75b5?v=54856406 https://openstax.org/books/university-physics-volume-3/pages/4-4-diffraction-gratings</desc><rect width="720" height="280" fill="#050c17"/><svg viewBox="0 0 720 280" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Prism refraction versus grating diffraction" y="0" width="720" height="280"><title>Prism refraction versus grating diffraction</title><desc>Schematic ray fan; numeric angles use minimum-deviation prism geometry and normal-incidence grating orders.</desc><rect width="720" height="280" fill="#050c17"/><text x="30" y="28" text-anchor="start" style="fill: rgb(221, 238, 255); font-size: 13px; font-family: monospace;">PRISM · refraction</text><text x="385" y="28" text-anchor="start" style="fill: rgb(221, 238, 255); font-size: 13px; font-family: monospace;">GRATING · interference</text><polygon points="120,75 60,205 185,205" fill="#183c59" stroke="#4fc3f7"/><path d="M15 150 H85" stroke="#ddeeff" fill="none" stroke-width="2"/><path d="M370 150 H450" stroke="#ddeeff" fill="none" stroke-width="2"/><path d="M445 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M448 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M451 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M454 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M457 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M460 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M463 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M466 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M469 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M472 70 V220" stroke="#607e99" fill="none" stroke-width="2"/><path d="M160 155 L330 182.28210407439332" stroke="rgb(112,80,218)" fill="none" stroke-width="1.5"/><path d="M470 150 L673.8623064717948 120" stroke="rgb(112,80,218)" fill="none" stroke-width="1.5"/><path d="M160 155 L330 170.00652613154188" stroke="rgb(66,124,249)" fill="none" stroke-width="1.5"/><path d="M470 150 L672.2006676546841 116.25" stroke="rgb(66,124,249)" fill="none" stroke-width="1.5"/><path d="M160 155 L330 161.373828141351" stroke="rgb(43,221,193)" fill="none" stroke-width="1.5"/><path d="M470 150 L670.3272322975586 112.5" stroke="rgb(43,221,193)" fill="none" stroke-width="1.5"/><path d="M160 155 L330 155" stroke="rgb(150,223,83)" fill="none" stroke-width="4"/><path d="M470 150 L668.2359957222704 108.75" stroke="rgb(150,223,83)" fill="none" stroke-width="4"/><path d="M160 155 L330 150.101970212313" stroke="rgb(255,174,63)" fill="none" stroke-width="1.5"/><path d="M470 150 L665.9199836668021 105" stroke="rgb(255,174,63)" fill="none" stroke-width="1.5"/><path d="M160 155 L330 146.2070643600469" stroke="rgb(249,104,62)" fill="none" stroke-width="1.5"/><path d="M470 150 L663.3711198705743 101.25" stroke="rgb(249,104,62)" fill="none" stroke-width="1.5"/><path d="M160 155 L330 143.01517385536997" stroke="rgb(239,65,65)" fill="none" stroke-width="1.5"/><path d="M470 150 L660.5800619162455 97.5" stroke="rgb(239,65,65)" fill="none" stroke-width="1.5"/><text x="25" y="256" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">Ray fan exaggerated; compare numeric angles.</text><text x="385" y="256" text-anchor="start" style="fill: rgb(154, 178, 204); font-size: 13px; font-family: monospace;">mλ/d outside [−1,1]: no order.</text></svg></svg>